<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
height:100vh;
background:linear-gradient(135deg,#ff4b91,#8e44ad,#4facfe);
display:flex;
justify-content:center;
align-items:center;
}

.screen{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
transition:1s;
}

.lock{
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
padding:30px;
border-radius:25px;
text-align:center;
width:90%;
max-width:340px;
color:#fff;
box-shadow:0 0 30px rgba(255,255,255,.3);
}

.lock h1{
margin-bottom:10px;
}

.lock input{
width:100%;
padding:14px;
margin:20px 0;
border:none;
border-radius:10px;
font-size:18px;
text-align:center;
}

.lock button{
padding:14px 30px;
border:none;
border-radius:30px;
background:#fff;
color:#ff2d75;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#intro{
display:none;
text-align:center;
padding:20px;
color:#fff;
}

#intro h1{
font-size:42px;
animation:glow 2s infinite alternate;
}

#intro p{
margin-top:20px;
font-size:18px;
line-height:1.7;
max-width:340px;
}

.nextBtn{
margin-top:25px;
padding:14px 28px;
border:none;
border-radius:30px;
background:#fff;
color:#ff2d75;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

@keyframes glow{
from{ text-shadow:0 0 10px #fff; }
to{ text-shadow:0 0 30px yellow; }
}

.heart{
position:absolute;
bottom:-30px;
animation:float 7s linear infinite;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
</style>
</head>
